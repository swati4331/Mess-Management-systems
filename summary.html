<!DOCTYPE html>
<html>
<head>
  <title>Booking Summary</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h2 {
      margin: 20px;
      color: #22c55e;
    }

    table {
      width: 70%;
      margin: auto;
      border-collapse: collapse;
      background: white;
      color: black;
      border-radius: 10px;
      overflow: hidden;
    }

    th {
      background: #1e293b;
      color: white;
      padding: 12px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background: #f1f5f9;
    }

    .cancel-btn {
      padding: 6px 12px;
      background: red;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .cancel-btn:hover {
      background: darkred;
    }

    .empty {
      margin-top: 40px;
      font-size: 18px;
      color: #f87171;
    }

    .btn {
      margin: 20px;
      padding: 10px 20px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>📋 Booking Summary</h2>

<div id="summaryContainer"></div>

<button class="btn" onclick="goBack()">⬅ Back</button>

<script>
let bookedMeals = JSON.parse(localStorage.getItem("bookedMeals")) || {};
const container = document.getElementById("summaryContainer");

function loadSummary() {
  let rows = "";

  for (let day in bookedMeals) {
    for (let meal in bookedMeals[day]) {
      if (bookedMeals[day][meal]) {
        rows += `
          <tr>
            <td>${day}</td>
            <td>${meal}</td>
            <td>Booked ✅</td>
            <td>
              <button class="cancel-btn" onclick="cancelMeal('${day}','${meal}')">
                Cancel ❌
              </button>
            </td>
          </tr>
        `;
      }
    }
  }

  if (rows === "") {
    container.innerHTML = "<p class='empty'>No meals booked yet ❌</p>";
  } else {
    container.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Day</th>
            <th>Meal</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
        </tbody>
      </table>
    `;
  }
}

// cancel one meal
function cancelMeal(day, meal) {
  delete bookedMeals[day][meal];

  // remove day if empty
  if (Object.keys(bookedMeals[day]).length === 0) {
    delete bookedMeals[day];
  }

  localStorage.setItem("bookedMeals", JSON.stringify(bookedMeals));
  loadSummary();
}

// back button
function goBack() {
  window.location.href = "weekly.html";
}

// load on start
loadSummary();
</script>

</body>
</html>
